apis:
- aid: codesandbox:define-api
  name: CodeSandbox Define API
  description: >-
    The Define API allows programmatic creation of browser sandboxes from code files, useful for documentation
    sites and code examples that need to generate a sandbox on the fly. Supports both GET and POST requests
    to https://codesandbox.io/api/v1/sandboxes/define, accepting a files parameter containing the sandbox
    file structure and returning either a rendered sandbox or JSON with sandbox_id when using the ?json=1
    query parameter.
  humanURL: https://codesandbox.io/docs/learn/browser-sandboxes/cli-api
  baseURL: https://codesandbox.io/api/v1
  tags:
  - Browser Sandboxes
  - REST API
  - Code Examples
  properties:
  - type: Documentation
    url: https://codesandbox.io/docs/learn/browser-sandboxes/cli-api
- aid: codesandbox:sandpack
  name: Sandpack Embed Toolkit
  description: >-
    Sandpack is an open-source component toolkit for creating live-running code editing experiences powered
    by CodeSandbox. It supports React via @codesandbox/sandpack-react and plain JavaScript via @codesandbox/sandpack-client,
    enabling developers to embed interactive code editors and previews with built-in support for Next.js,
    Remix, Vite, Astro, hot module reloading, and npm dependency support. Also supports iframe-based sandbox
    embedding.
  humanURL: https://sandpack.codesandbox.io/docs
  tags:
  - Embedding
  - Code Editor
  - React
  - JavaScript
  - Component Toolkit
  properties:
  - type: Documentation
    url: https://sandpack.codesandbox.io/docs
  - type: GitHubRepository
    url: https://github.com/codesandbox/sandpack
